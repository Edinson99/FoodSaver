name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'foodsaver-backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'foodsaver-backend/**'

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./foodsaver-backend/foodsaver-backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests
      run: ./gradlew test

    - name: Run build
      run: ./gradlew build

    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Backend Test Results
        path: 'foodsaver-backend/foodsaver-backend/build/test-results/test/*.xml'
        reporter: java-junit

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: foodsaver-backend/foodsaver-backend/build/test-results/

  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    defaults:
      run:
        working-directory: ./foodsaver-backend/foodsaver-backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build application
      run: ./gradlew build -x test

    - name: Build Docker image
      run: |
        echo "FROM openjdk:17-jre-slim" > Dockerfile
        echo "COPY build/libs/*.jar app.jar" >> Dockerfile
        echo "EXPOSE 8080" >> Dockerfile
        echo "ENTRYPOINT [\"java\",\"-jar\",\"/app.jar\"]" >> Dockerfile
        docker build -t foodsaver-backend:latest .

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: backend-jar
        path: foodsaver-backend/foodsaver-backend/build/libs/*.jar

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: backend-jar

    - name: Deploy to staging
      run: |
        echo "🚀 Deploying backend to staging environment..."
        echo "✅ Backend deployed successfully!"
        # Aquí agregarías los comandos reales de deploy
        # Por ejemplo: scp, docker push, kubectl apply, etc.
